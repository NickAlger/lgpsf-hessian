name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dependency hygiene
        run: python3 tools/check_dependencies.py

  build-test:
    runs-on: ubuntu-latest
    env:
      # OpenMPI: allow n=4 tests on 2-core runners
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        # Azure apt mirror outages can hang the default update for an hour;
        # short timeouts + retries make the fallback mirror kick in fast, and
        # a failed update is survivable (the image ships recent indexes).
        run: |
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 || true
          sudo apt-get install -y cmake pkg-config petsc-dev libhypre-dev \
            libscalapack-openmpi-dev liblapack-dev libopenmpi-dev
      - name: configure
        # The hypre outcome is surfaced as a notice (visible through the public
        # checks API, unlike the raw step log).
        run: |
          PKG_CONFIG_PATH=$(dirname $(find /usr/lib -name "PETSc.pc" | head -1)) \
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLGH_FETCH_LGPSF=ON 2>&1 | tee configure.log
          exit ${PIPESTATUS[0]}
      - name: surface the hypre outcome
        run: |
          grep -i "hypre" configure.log | while IFS= read -r l; do echo "::notice::${l}"; done
      - name: build (-j 2 — Eigen-heavy TUs, see docs/platform-notes.md)
        run: |
          cmake --build build -j 2 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # Annotations are visible through the public checks API; the raw step
      # log is not.  Surface the failure so it can be diagnosed remotely.
      - name: surface build errors as annotations
        if: failure()
        run: |
          grep -n -i -m 4 -E "error|killed|no such file" build.log | \
            while IFS= read -r l; do echo "::error::${l}"; done
          tail -6 build.log | while IFS= read -r l; do echo "::error::tail: ${l}"; done
      - name: test
        run: |
          ctest --test-dir build --output-on-failure -V 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - name: surface the prior test's hierarchies
        if: always()
        run: |
          grep -h "lgh_prior: hierarchy" test.log | sort | uniq -c | \
            while IFS= read -r l; do echo "::notice::${l}"; done
